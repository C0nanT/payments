services:
  postgres:
    image: postgres:17-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_USER: ${PAYMENTS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PAYMENTS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PAYMENTS_POSTGRES_DB}
    ports:
      - ${PAYMENTS_POSTGRES_PORT}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENTS_POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis: 
    image: redis:8-alpine
    container_name: payments-redis
    ports:
      - ${PAYMENTS_REDIS_PORT}:6379

  nats:
    image: nats:2.11-alpine
    container_name: payments-nats
    command: ["-js", "-m", "8222"]
    ports:
      - ${PAYMENTS_NATS_PORT}:4222
      - ${PAYMENTS_NATS_MONITOR_PORT}:8222

volumes:
  pgdata:
